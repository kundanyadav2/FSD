<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
</head>
<body>
  <h3>Expense Tracker</h3>
  <form action="javascript:void(0);">
    <label for="expenceName">Expense Name</label><br>
    <input id="expenceName" type="text" placeholder="e.g Groceries"><br><br>

    <label for="expenceAmount">Amount (₹)</label><br>
    <input id="expenceAmount" type="text" placeholder="e.g 500"><br><br>

    <label for="expenceDescription">Description</label><br>
    <input id="expenceDescription" type="text" placeholder="e.g bought fruits and vegetables"><br><br>

    <label for="expenceDate">Date</label><br>
    <input id="expenceDate" type="date"><br><br>

    <button type="button" onclick="addExpense()">Add Expense</button><br><br>
  </form>

  <div>
    <table border="1" id="expenseTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Amount</th>
          <th>Description</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

<script>
  const expenses = [];

  function addExpense() {
    const name = document.getElementById("expenceName").value.trim();
    const amount = parseFloat(document.getElementById("expenceAmount").value);
    const description = document.getElementById("expenceDescription").value.trim();
    const date = document.getElementById("expenceDate").value;

    if (!name || isNaN(amount) || amount <= 0 || !date) {
      alert("Please enter valid expense details");
      return;
    }

    expenses.push({ name, amount, description, date });

    // reset fields
    document.getElementById("expenceName").value = "";
    document.getElementById("expenceAmount").value = "";
    document.getElementById("expenceDescription").value = "";
    document.getElementById("expenceDate").value = "";

    renderTable();
  }

  function deleteExpense(index) {
    expenses.splice(index, 1);
    renderTable();
  }

  function renderTable() {
    const tbody = document.querySelector("#expenseTable tbody");
    tbody.innerHTML = "";
    let total = 0;

    expenses.forEach((exp, index) => {
      total += exp.amount;
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${exp.name}</td>
        <td>₹${exp.amount}</td>
        <td>${exp.description}</td>
        <td>${exp.date}</td>
        <td><button onclick="deleteExpense(${index})">Delete</button></td>
      `;
      tbody.appendChild(row);
    });

    // show total at the bottom
    if (expenses.length > 0) {
      const totalRow = document.createElement("tr");
      totalRow.innerHTML = `
        <td colspan="5"><strong>Total: ₹${total}</strong></td>
      `;
      tbody.appendChild(totalRow);
    }
  }
</script>
</body>
</html>
